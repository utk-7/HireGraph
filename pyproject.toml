[tool.poetry]
package-mode = false
name = "hiregraph"
version = "0.1.0"
description = "A portfolio RAG chatbot combining Neo4j graph retrieval and vector search for a fictional recruiting-analytics domain."
authors = ["Author <author@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
langchain = "*"
langchain-openai = "*"
huggingface_hub = "*"
neo4j = "*"
fastapi = "*"
uvicorn = "*"
streamlit = "*"
plotly = "*"
python-dotenv = "*"
faker = "*"
requests = "^2.34.2"
tenacity = "^9.1.4"
langgraph = "^1.2.10"
langchain-huggingface = "^1.2.2"
langchain-community = "^0.4.2"

[tool.poetry.group.dev.dependencies]
black = "*"
isort = "*"
flake8 = "*"
pre-commit = "*"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
